<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC прототип</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>WebRTC прототип</h1>
        <button id="qr-code-button">QR code</button>
    </div>
    <hr>

    <script>
        const qrCodeButton = document.getElementById("qr-code-button")

        qrCodeButton.addEventListener("click", () => {
            Swal.fire({
                imageUrl: "https://api.qrserver.com/v1/create-qr-code/?&size=200x200&data=".concat(window.location.href),
                imageAlt: "QR code"
            });
        })
    </script>

    {% block content %} {% endblock %}
</body>
</html>
