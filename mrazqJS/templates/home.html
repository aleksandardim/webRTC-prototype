{% extends "base.html"%}

{% block content %}
<button id="create-room-button">Създай стая</button>
<button id="join-room-button">Влез в стая</button>

<script>

    const createRoomButton = document.getElementById("create-room-button")
    const joinRoomButton = document.getElementById("join-room-button")

    createRoomButton.addEventListener("click", () => {
        window.location.href = "/" + crypto.randomUUID()
    })

    joinRoomButton.addEventListener("click", () => {
        let uuidInput

        uuidInput = prompt("UUID номер: ")

        if (uuidInput == null || uuidInput == "") { return }

        window.location.href = "/" + uuidInput
    })
</script>

{% endblock %}
